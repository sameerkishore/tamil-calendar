name: RasiPalan
options:
  bundleIdPrefix: app.rasipalan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  RasiCore:
    path: Packages/RasiCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  RasiPalan:
    type: application
    platform: macOS
    sources:
      - path: RasiPalan
        excludes:
          - Resources/Layouts
      - path: RasiPalan/Resources/Layouts
        type: folder
        buildPhase: resources
    dependencies:
      - package: RasiCore
      - package: Sparkle
      - sdk: CoreLocation.framework
      - sdk: EventKit.framework
    info:
      path: RasiPalan/Info.plist
      properties:
        CFBundleDisplayName: Tamil Calendar
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.lifestyle
        NSPrincipalClass: NSApplication
        SUFeedURL: https://github.com/sameerkishore/tamil-calendar/releases/latest/download/appcast.xml
        SUPublicEDKey: YHNDHl8enzvxqeIh7ywiLaFBh7fHzMm5pkG8i4YG16M=
        SUEnableAutomaticChecks: true
        NSRemindersFullAccessUsageDescription: Tamil Calendar prints the reminders due on each sheet's day. It only reads them.
        NSRemindersUsageDescription: Tamil Calendar prints the reminders due on each sheet's day. It only reads them.
        NSCalendarsFullAccessUsageDescription: Tamil Calendar prints the events on each sheet's day from the calendars you choose. It only reads them.
        NSCalendarsUsageDescription: Tamil Calendar prints the events on each sheet's day from the calendars you choose. It only reads them.
        NSHumanReadableCopyright: "© 2026 Sameer Kishore. All rights reserved."
        NSLocationUsageDescription: Tamil Calendar uses your approximate location to calculate sunrise, sunset and Rahu Kalam for your city. It is not stored anywhere except on this Mac.
        NSLocationWhenInUseUsageDescription: Tamil Calendar uses your approximate location to calculate sunrise, sunset and Rahu Kalam for your city. It is not stored anywhere except on this Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rasipalan.RasiPalan
        PRODUCT_NAME: Tamil Calendar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
