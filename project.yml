name: RasiPalan
options:
  bundleIdPrefix: app.rasipalan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  RasiCore:
    path: Packages/RasiCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  RasiPalan:
    type: application
    platform: macOS
    sources:
      - path: RasiPalan
        excludes:
          - Resources/Layouts
      - path: RasiPalan/Resources/Layouts
        type: folder
        buildPhase: resources
    dependencies:
      - package: RasiCore
      - sdk: CoreLocation.framework
    info:
      path: RasiPalan/Info.plist
      properties:
        CFBundleDisplayName: Rasi Palan
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.lifestyle
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Paper sounds, artwork and almanac all made in code. Thirukkural couplets by Thiruvalluvar."
        NSLocationUsageDescription: Rasi Palan uses your approximate location to calculate sunrise, sunset and Rahu Kalam for your city. It is not stored anywhere except on this Mac.
        NSLocationWhenInUseUsageDescription: Rasi Palan uses your approximate location to calculate sunrise, sunset and Rahu Kalam for your city. It is not stored anywhere except on this Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rasipalan.RasiPalan
        PRODUCT_NAME: Rasi Palan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
